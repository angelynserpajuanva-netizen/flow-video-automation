<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- HyperFrames intro: 4 seconds. Edit TITLE / SUBTITLE / colors below, then: npm run render:intro -->
  <style>
    :root { --bg: #0e0f13; --accent: #ff5a36; --text: #f5f3ee; }
    html, body { margin: 0; background: var(--bg); }
    #intro { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
             font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
    #bar { position: absolute; left: 160px; top: 470px; width: 14px; height: 140px; background: var(--accent); }
    #title { position: absolute; left: 210px; top: 440px; margin: 0; font-size: 120px; font-weight: 800; letter-spacing: -3px; }
    #subtitle { position: absolute; left: 214px; top: 590px; margin: 0; font-size: 44px; font-weight: 400; opacity: .75; }
  </style>
</head>
<body>
  <div id="intro" data-composition-id="intro" data-start="0" data-duration="4" data-width="1920" data-height="1080">
    <div id="bar" class="clip" data-start="0" data-duration="4" data-track-index="1"></div>
    <h1 id="title" class="clip" data-start="0.3" data-duration="3.7" data-track-index="2">YOUR CHANNEL</h1>
    <p id="subtitle" class="clip" data-start="0.7" data-duration="3.3" data-track-index="3">Episode title goes here</p>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#bar", { scaleY: 0, transformOrigin: "top", duration: 0.5, ease: "power3.out" }, 0)
        .from("#title", { x: -60, opacity: 0, duration: 0.7, ease: "power3.out" }, 0.3)
        .from("#subtitle", { y: 20, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.7)
        .to(["#bar", "#title", "#subtitle"], { opacity: 0, duration: 0.4 }, 3.6);
      window.__timelines = window.__timelines || {};
      window.__timelines.intro = tl;
    </script>
  </div>
</body>
</html>
